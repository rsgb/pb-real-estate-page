# Netlify configuration.
#
# The build is exactly what it already was in the Netlify UI — this file only
# writes it down and adds the publish functions (see docs/publishing.md).
#
# Python in the build
# -------------------
# `npm run prebuild` renders every edition's two PDFs from its JSON with
# scripts/pdf/render-pdf.py (decision D-34: no PDF is ever committed). One
# file at the repo root, which Netlify's build image reads from the base
# directory before the build command runs, makes that possible:
#
#   requirements.txt  `pip install -r` runs automatically when this file
#                     exists; it holds reportlab, the renderer's only
#                     non-standard-library dependency.
#
# No Python version is pinned on purpose: the renderer runs on any Python
# from 3.8 up, and naming a version the image does not ship (its default is
# 3.13 on the Noble image) would make Netlify download an interpreter on
# every build. If a version ever has to be forced, use runtime.txt.
#
# Neither file has anything to do with the Netlify Functions, which are Node.
# If the build ever fails on Python, docs/publishing.md says what to check.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # esbuild inlines `import schema from "...edition.schema.json"`, so the file
  # is already in the bundle. It is listed anyway so the functions keep working
  # if the bundler ever changes.
  included_files = ["src/content/editions/edition.schema.json"]
